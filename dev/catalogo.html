<!doctype html>
<meta charset="utf-8" />
<title>Catálogo simulado · BAG STORE SF</title>
<script>
/* Carga el index.html real con Supabase simulado (dev/catalog-mock.js) para probar el carrito y los pedidos.
   Estados: ?state=ok | fail | stockout | offline */
(async () => {
  const CLOSE = '<' + '/script>';
  const html = await (await fetch('../index.html', { cache: 'no-store' })).text();
  const configTag = '<script src="assets/js/config.js">' + CLOSE;
  const patched = html
    .replace('<head>', '<head><base href="../" />')
    .replace(configTag, configTag + '<script src="dev/catalog-mock.js">' + CLOSE);
  document.open();
  document.write(patched);
  document.close();
})();
</script>
